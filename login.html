<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - SQLi Firewall Demo</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container">
      <div class="row justify-content-center align-items-center" style="height:85vh;">
        <div class="col-12 col-sm-9 col-md-6 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h3 class="card-title mb-3">Sign in</h3>
              {% if message %}
                <div class="alert alert-danger" role="alert">{{ message }}</div>
              {% endif %}
              <form method="post" action="/login" novalidate>
                <div class="mb-3">
                  <label class="form-label">Username</label>
                  <input class="form-control" type="text" name="username" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input class="form-control" type="password" name="password" required>
                </div>

                <div class="d-grid mb-2">
                  <button class="btn btn-primary" type="submit">Login</button>
                </div>

                <!-- Register button: goes to /register -->
                <div class="d-grid">
                  <a href="/register" class="btn btn-success" role="button">Register</a>
                </div>

              </form>

              <hr class="my-3" />
              <p class="small text-muted mb-1">Demo credentials:</p>
              <p class="mb-0"><strong>alice</strong> / alicepass &nbsp; | &nbsp; <strong>bob</strong> / bobpass</p>
              <p class="mt-2 small text-muted">To test detection try <code>id=5; DROP TABLE users;</code> as username or password.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Bootstrap JS (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
