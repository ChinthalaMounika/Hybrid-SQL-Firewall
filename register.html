<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register - SQLi Firewall Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container">
      <div class="row justify-content-center align-items-center" style="height:85vh;">
        <div class="col-12 col-sm-9 col-md-6 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h3 class="card-title mb-3">Register</h3>
              {% if message %}
                <div class="alert alert-danger" role="alert">{{ message }}</div>
              {% endif %}
              <form method="post" action="/register" novalidate>
                <div class="mb-3">
                  <label class="form-label">Username</label>
                  <input class="form-control" type="text" name="username" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input class="form-control" type="password" name="password" required>
                </div>
                <div class="d-grid">
                  <button class="btn btn-success" type="submit">Register</button>
                </div>
              </form>
              <div class="mt-3 text-center">
                <a href="/login" class="btn btn-outline-primary btn-sm">Back to Login</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
