<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container">
    <div class="row justify-content-center align-items-center" style="height:85vh;">
      <div class="col-12 col-sm-10 col-md-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h3>Welcome, {{ user }}!</h3>
              <a href="/logout" class="btn btn-outline-secondary btn-sm">Logout</a>
            </div>
            <p class="lead">Login successful — you reached the protected page.</p>
            <hr/>
            <h6>Quick actions</h6>
            <ul>
              <li>Inspect detection logs: <code>detections.csv</code></li>
              <li>Retrain model if you find false positives/negatives</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
