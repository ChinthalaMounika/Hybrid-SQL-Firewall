<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blocked - SQLi Firewall</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container">
    <div class="row justify-content-center align-items-center" style="height:85vh;">
      <div class="col-12 col-sm-8 col-md-6">
        <div class="card shadow-sm">
          <div class="card-body text-center">
            <h2 class="text-danger mb-3">Request blocked</h2>
            <p class="lead">The request was detected as <strong>malicious</strong> by the firewall.</p>
            <p class="text-muted">Detection score: <strong>{{ reason_score }}</strong></p>
            <a href="/" class="btn btn-secondary mt-3">Back to login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
